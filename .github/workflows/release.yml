name: Release Workflow

env:
  PROJECT_NAME: dispatcherd

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    # Only publish releases with v-prefixed tags from the upstream repository.
    if: github.repository == 'ansible/dispatcherd' && startsWith(github.event.release.tag_name, 'v')
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U build setuptools setuptools_scm

      - name: Build package
        run: python -m build

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*

      # Keep artifact storage and publishing aligned with django-ansible-base:
      # https://github.com/ansible/django-ansible-base/blob/devel/.github/workflows/release.yml
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: |
            dist/*.tar.gz
            dist/*.whl
          retention-days: 90

  publish-pypi:
    name: Publish to PyPI
    needs:
      - build

    runs-on: ubuntu-latest

    timeout-minutes: 1

    environment:
      name: pypi
      url: https://pypi.org/project/${{ env.PROJECT_NAME }}

    permissions:
      contents: read  # This job doesn't need to `git push` anything
      id-token: write  # PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish dists to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
