---
name: CI
on:
  pull_request:
  push:
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        py_version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py_version }}

      - name: Install dispatcherd
        run: pip install -e .[pg_notify,metrics]
      - run: make postgres
      - run: pip install -r requirements_dev.txt
      - name: Run synchronous tests with coverage
        run: pytest tests/ -vv -s --cov=dispatcherd --cov-append
      - name: Run asyncio tests with coverage
        run: pytest asyncio_tests/ -vv -s --cov=dispatcherd --cov-append
      - name: Combine coverage data
        run: |
          if ls .coverage_subprocess.* >/dev/null 2>&1; then
            echo "Combining subprocess coverage files"
            python -m coverage combine --append .coverage_subprocess.*
          else
            echo "No subprocess coverage files to combine; skipping combine"
          fi
      - name: Generate coverage.xml
        run: python -m coverage xml
      - name: Inject PR number into coverage.xml
        if: github.event_name == 'pull_request'
        run: |
          if [ -f coverage.xml ]; then
            sed -i '2i<!-- PR ${{ github.event.pull_request.number }} -->' coverage.xml
            echo "Injected PR number ${{ github.event.pull_request.number }} into coverage.xml"
          fi
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.py_version }}
          path: coverage.xml


  black:
    name: Run black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - run: pip install black
      - run: black --check .

  isort:
    name: Run isort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - run: pip install isort
      - run: isort --check-only .

  mypy:
    name: Run mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - run: pip install mypy
      - run: pip install -e .[pg_notify,metrics]
      - run: python3 -m pip install types-PyYAML
      - run: mypy

  flake8:
    name: Run flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - run: pip install flake8
      - run: flake8 .

  sqlserver:
    name: SQL Server integration and broker contracts
    env:
      SQLSERVER_TEST_PYTHON: "3.14"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable database credentials
        run: |
          password="Sql1!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Run SQL Server tests
        run: make test-sqlserver-docker
      - name: Show database logs on failure
        if: failure()
        run: docker compose logs sqlserver
      - name: Remove disposable database
        if: always()
        run: docker compose --profile sqlserver --profile sqlserver-tests down --volumes
