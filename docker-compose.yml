---
services:
  msg_postgres:
    image: "postgres:15"
    container_name: dispatch_postgres
    environment:
      POSTGRES_DB: dispatch_db
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatching
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dispatch", "-d", "dispatch_db"]
      interval: 1s
      timeout: 5s
      retries: 20
    ports:
      - "55777:5432"
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [sqlserver]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Keep this optional at Compose parse time so PostgreSQL-only commands work.
      # SQL Server itself requires a nonempty, strong password when started.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-14333}:1433"
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
      - sqlserver-data:/var/opt/mssql
  sqlserver-tests:
    profiles: [sqlserver-tests]
    build:
      context: .
      dockerfile: tools/sqlserver/Dockerfile
      args:
        PYTHON_VERSION: ${SQLSERVER_TEST_PYTHON:-3.12}
    environment:
      MSSQL_HOST: sqlserver
      MSSQL_PORT: "1433"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    depends_on:
      sqlserver:
        condition: service_healthy
  dispatcherd1:
    container_name: dispatcherd1
    working_dir: /dispatcherd
    build:
      context: .
      dockerfile: tools/demo/Dockerfile
    environment:
      PATH: /dispatcherd/venv/bin:$PATH
      PYTHONPATH: .
      DISPATCHERD_CONFIG_FILE: /dispatcherd/dispatcher1.yml
    command: dispatcherd
    depends_on:
      msg_postgres:
        condition: service_healthy
    volumes:
      - "./:/dispatcherd/src"
    healthcheck:
      test: ["CMD", "dispatcherctl", "alive", "--expected-replies=2"]
      interval: 1s
      timeout: 5s
      retries: 5
  dispatcherd2:
    container_name: dispatcherd2
    build:
      context: .
      dockerfile: tools/demo/Dockerfile
    environment:
      PATH: /dispatcherd/venv/bin:$PATH
      PYTHONPATH: .
      DISPATCHERD_CONFIG_FILE: /dispatcherd/dispatcher2.yml
    command: dispatcherd
    depends_on:
      msg_postgres:
        condition: service_healthy
    volumes:
      - "./:/dispatcherd/src"
    healthcheck:
      test: ["CMD", "dispatcherctl", "alive", "--expected-replies=2"]
      interval: 1s
      timeout: 5s
      retries: 5

volumes:
  sqlserver-data:
